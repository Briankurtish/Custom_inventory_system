{% extends layout_path %}
{% load i18n %}
{% load crispy_forms_tags %}
{% block title %}{% trans "Edit Stock Details" %}{% endblock %}
{% block content %}
<div class="container mt-5">
  <div class="card">
    <div class="card-header">
      <h4>{% trans "Edit Stock Details" %}</h4>
    </div>
    <div class="card-body">
      <form method="post">
        {% csrf_token %}
        {{ form|crispy }}
        <div class="mt-3">
          <button type="submit" class="btn btn-success">{% trans "Save Changes" %}</button>
          <a href="{% url 'stock' %}" class="btn btn-secondary">{% trans "Cancel" %}</a>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}

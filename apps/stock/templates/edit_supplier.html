{% extends layout_path %}
{% load i18n %}
{% load crispy_forms_tags %}
{% block title %}{% trans "Edit Supplier" %}{% endblock %}
{% block content %}
<div class="container-xl py-5">
  <div class="card shadow-sm border-0 mb-4 bg-white">
    <div class="card-body">
      <h4 class="fw-bold text-primary mb-4">
        <i class="fa-solid fa-edit me-2"></i>{% trans "Edit Supplier" %}
      </h4>
      <form method="post">
        {% csrf_token %}
        {{ form|crispy }}
        <div class="mt-3">
          <button type="submit" class="btn btn-success">
            <i class="fa-solid fa-save me-1"></i>{% trans "Update Supplier" %}
          </button>
          <a href="{% url 'supplier-list' %}" class="btn btn-secondary">
            <i class="fa-solid fa-times me-1"></i>{% trans "Cancel" %}
          </a>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}

{% extends layout_path %}
{% load static %}

{% block title %}Edit SMS Group{% endblock %}

{% block content %}
<div class="container-xxl flex-grow-1 container-p-y">
    <!-- Header -->
    <div class="row">
        <div class="col-12">
            <div class="card">
                <div class="card-header d-flex justify-content-between align-items-center">
                    <h4 class="mb-0">Edit SMS Group</h4>
                    <a href="{% url 'sms:sms_groups' %}" class="btn btn-outline-secondary">
                        <i class="bx bx-arrow-back"></i> Back to Groups
                    </a>
                </div>
            </div>
        </div>
    </div>

    <!-- Edit Group Form -->
    <div class="row">
        <div class="col-12">
            <div class="card">
                <div class="card-body">
                    <form method="post">
                        {% csrf_token %}

                        <div class="row">
                            <div class="col-12 mb-3">
                                <label for="{{ form.name.id_for_label }}" class="form-label">Group Name</label>
                                {{ form.name }}
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="{{ form.description.id_for_label }}" class="form-label">Description</label>
                            {{ form.description }}
                        </div>

                        <div class="mb-3">
                            <label for="{{ form.customers.id_for_label }}" class="form-label">Select Customers</label>
                            {{ form.customers }}
                            <div class="form-text">Hold Ctrl/Cmd to select multiple customers</div>
                        </div>

                        <div class="d-flex justify-content-end gap-2">
                            <a href="{% url 'sms:sms_groups' %}" class="btn btn-outline-secondary">Cancel</a>
                            <button type="submit" class="btn btn-primary">Update Group</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
